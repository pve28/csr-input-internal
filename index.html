<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Input Proposal Internal - SIG</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif}.req{color:red}</style>
</head>
<body class="bg-[#f5f7fb] min-h-screen">
<div class="max-w-[650px] mx-auto p-4 md:p-6">
  <div class="bg-[#0f172a] rounded-[20px] p-5 text-white flex justify-between">
    <div class="flex gap-3 items-center"><div class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center font-black">S</div><div><div class="font-extrabold text-sm">INPUT INTERNAL</div><div class="text-[10px] opacity-60">Staff CSR SIG - Baturaja</div></div></div>
    <div class="text-[10px] bg-white/10 px-3 py-1.5 rounded-full self-center">V1 Input Only</div>
  </div>

  <div class="bg-white rounded-[20px] p-6 border mt-4">
    <h1 class="font-extrabold text-lg">Form Input Proposal (Internal)</h1>
    <p class="text-[11px] text-gray-500">Hanya untuk Staff. Semua 12 field wajib + lampiran.</p>

    <div class="mt-5 space-y-3 max-h-[75vh] overflow-y-auto pr-1">
      <div><label class="text-[10px] font-bold">Staff Penginput <span class="req">*</span></label><input id="staff_name" placeholder="Nama Staff" value="Staff CSR" class="w-full border rounded-xl p-3 text-sm bg-gray-50 mt-1"></div>
      <div><label class="text-[10px] font-bold">Nama Program <span class="req">*</span></label><input id="nama_program" class="w-full border rounded-xl p-3 text-sm bg-gray-50 mt-1"></div>
      <div><label class="text-[10px] font-bold">Program APS <span class="req">*</span></label><input id="program_aps" class="w-full border rounded-xl p-3 text-sm bg-gray-50 mt-1"></div>
      <div><label class="text-[10px] font-bold">Pilar TPB <span class="req">*</span></label><select id="pilar_tpb" class="w-full border rounded-xl p-3 text-sm bg-gray-50 mt-1"><option value="">Pilih</option><option>Sosial</option><option>Ekonomi</option><option>Lingkungan</option><option>Hukum & Tata Kelola</option></select></div>
      <div><label class="text-[10px] font-bold">Prioritas TPB <span class="req">*</span></label><input id="prioritas_tpb" class="w-full border rounded-xl p-3 text-sm bg-gray-50 mt-1"></div>
      <div><label class="text-[10px] font-bold">Uraian Program <span class="req">*</span></label><textarea id="uraian_program" rows="2" class="w-full border rounded-xl p-3 text-sm bg-gray-50 mt-1"></textarea></div>
      <div><label class="text-[10px] font-bold">Kegiatan <span class="req">*</span></label><input id="kegiatan" class="w-full border rounded-xl p-3 text-sm bg-gray-50 mt-1"></div>
      <div class="grid grid-cols-2 gap-2"><div><label class="text-[10px] font-bold">Provinsi <span class="req">*</span></label><input id="provinsi" value="Sumatera Selatan" class="w-full border rounded-xl p-3 text-sm bg-gray-50 mt-1"></div><div><label class="text-[10px] font-bold">Kab/Kota <span class="req">*</span></label><input id="kab_kota" value="OKU" class="w-full border rounded-xl p-3 text-sm bg-gray-50 mt-1"></div></div>
      <div class="grid grid-cols-2 gap-2"><div><label class="text-[10px] font-bold">Kecamatan <span class="req">*</span></label><input id="kecamatan" class="w-full border rounded-xl p-3 text-sm bg-gray-50 mt-1"></div><div><label class="text-[10px] font-bold">Kelurahan <span class="req">*</span></label><input id="kelurahan" class="w-full border rounded-xl p-3 text-sm bg-gray-50 mt-1"></div></div>
      <div><label class="text-[10px] font-bold">Kategori Wilayah <span class="req">*</span></label><select id="kategori_wilayah" class="w-full border rounded-xl p-3 text-sm bg-gray-50 mt-1"><option value="">Pilih</option><option>Ring 1</option><option>Ring 2</option><option>Ring 3</option><option>Non Ring</option></select></div>
      <div><label class="text-[10px] font-bold">Nominal Rp <span class="req">*</span></label><input id="nominal" type="number" class="w-full border rounded-xl p-3 text-sm bg-gray-50 mt-1 font-bold"></div>
      <div class="border-2 border-dashed rounded-xl p-3 bg-blue-50/30"><label class="text-[10px] font-bold">📎 Lampiran <span class="req">*</span></label><input id="f" type="file" class="w-full text-xs mt-1"></div>
    </div>

    <button onclick="kirim()" id="btn" class="w-full bg-[#cc0000] text-white py-3.5 rounded-xl font-bold text-sm mt-4">Simpan Proposal</button>
    <div id="msg" class="hidden mt-3 p-3 rounded-xl text-xs"></div>
    <div class="text-center mt-3"><a href="#" onclick="alert('Buka Dashboard V9 untuk Approval')" class="text-[11px] text-blue-600 underline">Lihat Dashboard Approval V9 →</a></div>
  </div>
</div>

<script>
const db = supabase.createClient("https://xytowszjjghlcbdchyzl.supabase.co","sb_publishable_wsqs32rXUPxI1WPdg5U04g_-02KtVKd");
function clearForm(){
  ['nama_program','program_aps','prioritas_tpb','uraian_program','kegiatan','kecamatan','kelurahan','nominal'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('pilar_tpb').value=''; document.getElementById('kategori_wilayah').value=''; document.getElementById('f').value='';
}
async function kirim(){
  const btn=document.getElementById('btn'); const msg=document.getElementById('msg');
  try{
    const get=id=>document.getElementById(id).value.trim();
    const staff_name=get('staff_name'), nama_program=get('nama_program'), program_aps=get('program_aps'), pilar_tpb=get('pilar_tpb'), prioritas_tpb=get('prioritas_tpb'), uraian_program=get('uraian_program'), kegiatan=get('kegiatan'), provinsi=get('provinsi'), kab_kota=get('kab_kota'), kecamatan=get('kecamatan'), kelurahan=get('kelurahan'), kategori_wilayah=get('kategori_wilayah'), nominal=get('nominal');
    const file=document.getElementById('f').files[0];
    if(!staff_name||!nama_program||!program_aps||!pilar_tpb||!prioritas_tpb||!uraian_program||!kegiatan||!provinsi||!kab_kota||!kecamatan||!kelurahan||!kategori_wilayah||!nominal||!file) throw new Error('Semua field wajib diisi + lampiran wajib');
    btn.innerText='Menyimpan...'; btn.disabled=true;
    const path=Date.now()+'_'+file.name.replace(/\s/g,'_');
    const {error:upErr}=await db.storage.from('proposal-files').upload(path,file); if(upErr) throw upErr;
    const {data}=db.storage.from('proposal-files').getPublicUrl(path);
    const {error}=await db.from('csr_proposals').insert([{nama_program,program_aps,pilar_tpb,prioritas_tpb,uraian_program,kegiatan,provinsi,kab_kota,kecamatan,kelurahan,kategori_wilayah,nominal:Number(nominal),file_name:file.name,file_url:data.publicUrl,tanggal_masuk:new Date().toISOString().slice(0,10),status:'Menunggu SM Approval'}]);
    if(error) throw error;
    clearForm();
    msg.className='mt-3 p-3 rounded-xl text-xs bg-green-100 text-green-700 border block'; msg.innerHTML='✅ Berhasil! Proposal oleh <b>'+staff_name+'</b> tersimpan. Form sudah dikosongkan.';
  }catch(e){ msg.className='mt-3 p-3 rounded-xl text-xs bg-red-100 text-red-700 border block'; msg.innerText='❌ '+e.message; }
  finally{ btn.innerText='Simpan Proposal'; btn.disabled=false; }
}
</script>
</body>
</html>
